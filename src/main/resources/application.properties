spring.application.name=management-tickets

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:management_tickets}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

app.security.access-token-expiration-minutes=15
app.security.refresh-token-expiration-days=7
app.security.issuer=management-tickets
app.security.jwt-secret=${JWT_SECRET}
app.security.refresh-cookie-name=refresh_token
app.security.allowed-origins[0]=http://localhost:4200

app.idempotency.record-ttl-hours=24
app.ticket.auto-close-days=7
